name: Unit Tests

on:
  push:
    branches:
      - master
    paths:
      - "**.go"
      - "**/go.mod"
      - "src/**"
      - "_ertgo"
  pull_request:
    paths:
      - "**.go"
      - "**/go.mod"
      - "src/**"
      - "_ertgo"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/edgelesssys/edgelessrt-dev:ci
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          path: ego
          submodules: recursive

      - name: Setup
        run: mkdir build

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTIDY=ON ../ego
          make -j`nproc`
        working-directory: build

      - name: Test
        run: OE_SIMULATION=1 ctest --output-on-failure
        working-directory: build

      - name: CPack
        run: cpack -G DEB
        working-directory: build

      - name: Build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ego
          path: build/*.deb
