name: Vale
on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
  pull_request:
    paths:
      - "docs/**"

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: errata-ai/vale-action@v2.1.2
        with:
          files: docs/docs
          fail_on_error: true
          version: 3.9.3
